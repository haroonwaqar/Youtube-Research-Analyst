<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Research Analyst</title>
    <meta name="description" content="Chat with any YouTube video transcript using AI. Powered by Shazam.">
    
    <!-- iOS Status Bar & Safe Area Theme Colors -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <!-- Inter font — closest Google Font to Apple's SF Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Marked.js for rendering markdown in AI responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ─── Sidebar ─── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <h1>Research Analyst</h1>
            </a>
            <button id="close-sidebar-btn" class="icon-btn mobile-only" aria-label="Close sidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="sidebar-body">
            <!-- URL Input -->
            <div class="input-group">
                <label for="url-input">YouTube URL</label>
                <input
                    type="url"
                    id="url-input"
                    placeholder="Paste a YouTube link..."
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="process-btn" class="btn-primary">
                    <span class="btn-label">Analyze Video</span>
                    <span class="btn-loader hidden">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </span>
                </button>
            </div>

            <!-- Video Info (shown after processing) -->
            <div id="video-info" class="video-info hidden">
                <img id="video-thumbnail" src="" alt="Video thumbnail">
                <h3 id="video-title"></h3>
                <p id="video-author"></p>
            </div>

            <!-- Status -->
            <div id="status-msg" class="status-msg hidden"></div>
        </div>

        <div class="sidebar-footer">
            <button id="export-btn" class="btn-export hidden">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Export Notes
            </button>
            <button id="theme-btn" class="theme-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                Light Mode
            </button>
            <p>Powered by Shazam</p>
        </div>
    </aside>

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- ─── Main Chat Area ─── -->
    <main class="chat-area">
        <!-- Mobile Header (Only visible on small screens) -->
        <div class="mobile-header">
            <button id="mobile-menu-btn" class="icon-btn" aria-label="Open menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h2 class="mobile-title">Research Analyst</h2>
            <div style="width: 24px;"></div> <!-- Placeholder for flex spacing -->
        </div>

        <!-- Messages container -->
        <div id="messages" class="messages">
            <!-- Welcome screen (shown when no conversation) -->
            <div id="welcome" class="welcome">
                <div class="welcome-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <h2>YouTube Research Analyst</h2>
                <p>Paste a YouTube URL in the sidebar and start asking questions about the video content.</p>

                <!-- Suggested question chips -->
                <div id="suggested-chips" class="suggested-chips">
                    <button class="chip" data-question="Summarize the key topics and main points of this video">Summarize key points</button>
                    <button class="chip" data-question="What are the most important takeaways from this video?">Key takeaways</button>
                    <button class="chip" data-question="Explain the main concepts discussed in this video in simple terms">Explain concepts</button>
                    <button class="chip" data-question="Create 5 quiz questions based on this video to test my understanding">Quiz me</button>
                </div>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="input-bar">
            <!-- Quick presets — visible while chatting -->
            <div id="quick-chips" class="quick-chips hidden">
                <button class="chip-sm" data-question="Summarize the key topics and main points of this video">Summarize</button>
                <button class="chip-sm" data-question="Explain that in simpler terms">Simplify</button>
                <button class="chip-sm" data-question="Can you give a real-world example of this?">Example</button>
                <button class="chip-sm" data-question="Create 5 quiz questions based on this video to test my understanding">Quiz me</button>
                <button class="chip-sm" data-question="What are the key takeaways I should remember?">Takeaways</button>
                <button class="chip-sm" data-question="Explain this topic as if I'm a beginner">Beginner mode</button>
            </div>
            <div class="input-bar-inner">
                <textarea
                    id="question-input"
                    placeholder="Ask something about the video..."
                    rows="1"
                    maxlength="500"
                    disabled
                ></textarea>
                <button id="send-btn" disabled aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <div class="input-bar-hint">
                <span id="char-count">0/500</span>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
